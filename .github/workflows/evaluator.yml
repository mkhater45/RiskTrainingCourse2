name: Automated Risk Engine Evaluator

on:
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov duckdb pandas openpyxl google-genai ghapi

      - name: Run Pytest Test Suite
        id: pytest
        continue-on-error: true
        run: |
          pytest --cov=risk_utils --cov-report=term-missing > pytest_output.txt 2>&1
          echo "PYTEST_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Run LLM Evaluator & Keyword Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/evaluate_pr.py
